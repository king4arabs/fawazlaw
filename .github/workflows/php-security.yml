name: PHP security migration checks
on:
  push:
    branches: [security/dependency-migration-2026-10-22]
  pull_request:
    paths: ['API-BACKEND/api/**', '.github/workflows/php-security.yml']
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: API-BACKEND/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: mbstring, xml, curl, pdo_sqlite, sqlite3, gd, zip, intl
          coverage: none
          tools: composer:2
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --locked --abandoned=report
      - run: |
          cp .env.example .env
          php artisan key:generate
          php artisan route:list
          php artisan test
